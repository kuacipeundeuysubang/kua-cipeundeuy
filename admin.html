<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel Admin — KUA Cipeundeuy</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body class="admin-page"><header class="admin-top"><a href="./" class="admin-brand"><img src="assets/logo-kemenag-resmi.png" alt="Logo Kementerian Agama"><span><strong>KUA CIPEUNDEUY</strong><small>KABUPATEN SUBANG</small></span></a><div><a href="./">Lihat website ↗</a><button type="button" id="accountButton" class="button outline"><span id="accountButtonLabel">Login</span></button></div></header><main id="adminRoot"><section class="admin-gate"><span class="eyebrow">AKSES PETUGAS</span><h1>Panel pengelolaan KUA</h1><p id="gateMessage" role="status">Memeriksa sesi dan izin akun…</p><button id="gateLogin" class="button" hidden>Login petugas</button></section></main><dialog id="accountDialog" aria-labelledby="accountTitle"><div class="dialog-top"><span class="eyebrow">AKSES PETUGAS</span><button type="button" class="icon-button" id="closeAccountDialog" aria-label="Tutup login"><i data-icon="close"></i></button></div><h2 id="accountTitle">Login Petugas</h2><p>Gunakan akun yang sudah terdaftar.</p><form id="accountForm"><label for="accountEmail">Email</label><input id="accountEmail" name="email" type="email" autocomplete="username" required placeholder="Email petugas"><label for="accountPassword">Password</label><input id="accountPassword" name="password" type="password" autocomplete="current-password" required placeholder="Masukkan password"><p id="accountError" class="account-error" role="status" aria-live="polite"></p><button type="submit" class="button" id="accountSubmit">Login</button></form></dialog><div id="accountNotice" class="account-notice" role="status" aria-live="polite" hidden></div><dialog id="editorDialog" aria-labelledby="editorTitle"><div class="editor-top"><span class="eyebrow">PENGELOLAAN DATA</span><button id="editorClose" class="icon-button" aria-label="Tutup formulir">×</button></div><h2 id="editorTitle"></h2><form id="recordForm"></form></dialog><dialog id="deleteDialog" aria-labelledby="deleteTitle"><h2 id="deleteTitle">Hapus data?</h2><p id="deleteDescription"></p><p>Data yang dihapus tidak dapat dipulihkan melalui panel ini.</p><p id="deleteError" role="alert"></p><div class="dialog-actions"><button type="button" id="cancelDelete" class="button outline">Batal</button><button type="button" id="confirmDelete" class="button danger">Hapus data</button></div></dialog><script type="module" src="admin.js"></script></body></html>
